<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#ffffff;
}


.container{

    width:700px;
    display:grid;

    grid-template-columns:150px 150px 150px 150px;
    grid-template-rows:100px 100px 100px 100px 100px 100px;

    gap:6px;
}

.box{

    border:3px solid black;
    background:#e9e9e9;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;
  
}


.box1{


    grid-row:1 / 3;

    background-color:rgb(226, 127, 127)
}

.box2{
    grid-column:2 / 4;

     background-color:rgb(222, 217, 125)
}

.box3{
    grid-column:4 / 5;

    background-color:rgb(117, 152, 241)
}

.box4{
    grid-column:2 / 3;

    background-color:rgb(122, 204, 194)
}

.box5{
    grid-column:3 / 5;

    background-color:rgb(217, 138, 219)
}



.box6{
    grid-column:1 / 2;

    background-color:rgb(223, 142, 191)
}

.box7{
    grid-column:2 / 4;

    background-color:rgb(150, 236, 224)
}

.box10{
    grid-column:4 / 5;
    grid-row:3 / 5;

    background-color:rgb(124, 178, 211)
}


.box8{
    grid-column:1 / 3;

    background-color:rgb(155, 225, 154)
}

.box9{
    grid-column:3 / 4;

    background-color:rgb(162, 122, 214)
}

.box11{
    grid-row:5 / 7;

    background-color:rgb(148, 230, 208)
}

.box12{
    grid-column:2 / 4;

    background-color:rgb(215, 139, 195)
}

.box13{
    grid-column:4 / 5;

    background-color:rgb(167, 106, 106)
}

.box14{
    grid-column:2 / 3;

    background-color:rgb(126, 145, 188)
}

.box15{
    grid-column:3 / 5;
     background-color:rgb(178, 201, 135)
}

</style>
</head>

<body>

<div class="container">

    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>

    <div class="box box6">6</div>
    <div class="box box7">7</div>
    <div class="box box8">8</div>
    <div class="box box9">9</div>
    <div class="box box10">10</div>

    <div class="box box11">11</div>
    <div class="box box12">12</div>
    <div class="box box13">13</div>
    <div class="box box14">14</div>
    <div class="box box15">15</div>

</div>

</body>
</html>
