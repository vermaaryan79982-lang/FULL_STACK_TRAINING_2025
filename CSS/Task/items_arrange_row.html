<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpage</title>

    <style>

         
    .container{

      width: 85%;
      border: 3px solid lightblue;

      margin-left: 70px;

      padding: 15px;

     
      display: flex;

      justify-content: space-between;
      align-items: center;
    }

      background-color: #4f79a3;
      color: white;

      width: 170px;
      height: 70px;

      border-radius: 12px;

      font-size: 28px;

      display: flex;
      justify-content: center;
      align-items: center;
    } 


    </style>
</head>
<body>


  <h1>Task 1</h1>

  <p>
    In this task, the list items are the navigation for a site.
    They should be laid out as a row, with an equal amount of
    space between each item.
  </p>

  <p>
    Your final result should look like the image below:
  </p>

  <div class="container">

    <div class="box">
      
      Home
    </div>

    <div class="box">About Us</div>

    <div class="box">Our Products</div>

    <div class="box">Contact Us</div>

  </div>
