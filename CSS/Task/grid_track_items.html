<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#eeeeee;

    font-family:Arial, Helvetica, sans-serif;
}

.main{

    width:80%;

    margin:auto;

    margin-top:50px;
}

h1{

    color:blue;

    margin-bottom:30px;
}

p{

    font-size:20px;

    line-height:35px;

    margin-bottom:20px;
}

.grid{

    width:600px;
    height:340px;

    border:1px solid blue;

    padding:10px;

    display:grid;

   
    grid-template-columns:1fr 1fr 1fr 1fr;

   
    grid-template-rows:100px 100px 100px;

    gap:10px;

    margin-top:30px;
}



.box1{

    background:#0c7959;

    color:white;

    padding:15px;

    border-radius:8px;

    border:4px solid #4d6772;

    font-size:25px;

   
    grid-column:1 / 4;

   
    grid-row:1 / 3;
}



.box2{

    background:#19838d;

    color:white;

    padding:15px;

    border-radius:8px;

    border:4px solid #c6c38f;

    font-size:25px;


    grid-column:2 / 5;

    
    grid-row:2 / 4;
}

</style>
</head>

<body>

<div class="main">

    <h1>Task 2</h1>

    <p>
        In this task, we already have a grid defined.
    </p>

    <p>
        By editing the CSS rules for the two child
        elements, cause them to span over several
        grid tracks each.
    </p>

    <p>
        The second item should overlay the first.
    </p>


    <div class="grid">

        <div class="box1">One</div>

        <div class="box2">Two</div>

    </div>

</div>

</body>
</html>
